<style>
:root{
  --navy:#003056; --navy-d:#00203D; --navy-2:#0A4170; --navy-3:#165A94; --navy-4:#2B77B5;
  --gold:#E8C57C; --gold-l:#F6E6BE; --gold-d:#B68C45; --gold-dd:#7B5C28;
  --gold-grad:linear-gradient(90deg,#F6E6BE 0%,#E8C57C 45%,#C49A52 100%);
  --ink:#12304F; --mut:#6B7C93; --line:#E3EAF3; --bg:#F3F6FA; --card:#FFFFFF;
  --p1:#9EC8F0; --p2:#F5C6A5; --p3:#B5E2CA; --p4:#D6C4F2; --p5:#F7B9C7; --p6:#F5E3A0; --p7:#A9DADF; --p8:#C8D2E6; --p9:#E9C9E0; --p10:#CFE3A8;
  --up:#1E9E6A; --dn:#D2475B;
  --r:16px; --sh:0 1px 2px rgba(0,32,61,.05),0 6px 20px rgba(0,32,61,.07);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Be Vietnam Pro','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.num{font-variant-numeric:tabular-nums}
.gold-text{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ===== layout ===== */
.top{background:linear-gradient(135deg,var(--navy-d) 0%,var(--navy) 55%,var(--navy-2) 100%);color:#fff;position:sticky;top:0;z-index:30;box-shadow:0 2px 14px rgba(0,32,61,.35)}
.top-in{max-width:1320px;margin:0 auto;padding:12px 24px 8px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:16px}
.brand img{height:40px;display:block}
.bt{border-left:1px solid rgba(232,197,124,.45);padding-left:16px;display:flex;flex-direction:column}
.bt b{font-size:16px;font-weight:700;letter-spacing:.2px}
.bt span{font-size:12px;color:#BFD3E8}
.meta{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.asof{text-align:right;line-height:1.2}
.asof small{display:block;font-size:11px;color:#BFD3E8}
.asof b{font-size:18px}
.mode{display:inline-flex;background:rgba(255,255,255,.1);border:1px solid rgba(232,197,124,.4);border-radius:999px;padding:3px}
.mode button{border:0;background:transparent;color:#DCE8F5;font-size:12.5px;font-weight:500;padding:6px 14px;border-radius:999px;cursor:pointer;transition:.15s}
.mode button.on{background:var(--gold-grad);color:var(--navy-d);font-weight:700}
.tabs{border-top:1px solid rgba(255,255,255,.08)}
.tabs-in{max-width:1320px;margin:0 auto;padding:0 18px;display:flex;gap:4px;overflow-x:auto}
.tab{border:0;background:transparent;color:#BFD3E8;font-size:14px;font-weight:500;padding:11px 18px;cursor:pointer;position:relative;white-space:nowrap}
.tab:hover{color:#fff}
.tab.on{color:#fff;font-weight:700}
.tab.on::after{content:'';position:absolute;left:14px;right:14px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--gold-grad)}
.banner{background:var(--gold-l);color:var(--gold-dd);text-align:center;padding:8px 16px;font-size:13px;border-bottom:1px solid var(--gold)}
.fbar{background:#fff;border-bottom:1px solid var(--line)}
.fbar-in{max-width:1320px;margin:0 auto;padding:10px 24px;display:flex;flex-direction:column;gap:10px}
.dr{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pres{display:inline-flex;background:#EEF3F9;border-radius:10px;padding:3px}
.pre{border:0;background:transparent;font-size:12.5px;padding:6px 12px;border-radius:8px;color:var(--ink);cursor:pointer;font-weight:500}
.pre.on{background:var(--navy);color:var(--gold-l);font-weight:700}
.dates{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px}
.dates input{font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;color:var(--ink);background:#fff}
.fps{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fp{position:relative}
.fb{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;cursor:pointer;font-size:12.5px;color:var(--ink);max-width:230px}
.fb:hover{border-color:var(--navy-4)}
.fl{color:var(--mut)}
.fv{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px}
.fb i{font-style:normal;color:var(--mut);font-size:10px}
.fp.act .fb{background:var(--gold-l);border-color:var(--gold)}
.fp.act .fv{color:var(--gold-dd)}
.pop{position:absolute;top:calc(100% + 6px);left:0;width:290px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 36px rgba(0,32,61,.22);z-index:40;padding:10px}
.pop .sq{width:100%}
.sq{font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--ink);outline:none}
.sq:focus{border-color:var(--navy-4)}
.pa{display:flex;gap:6px;margin:8px 0 4px}
.pa button{border:0;background:#EEF3F9;border-radius:6px;font-size:12px;padding:4px 10px;cursor:pointer;color:var(--ink)}
.pl{max-height:260px;overflow:auto}
.pl label{display:flex;gap:8px;align-items:flex-start;padding:5px 4px;font-size:13px;cursor:pointer;border-radius:6px}
.pl label:hover{background:#F3F6FA}
.clr{border:0;background:transparent;color:var(--dn);font-size:12.5px;cursor:pointer;font-weight:600}
.chkline{background:#fff;border-bottom:1px solid var(--line)}
.chkline-in{max-width:1320px;margin:0 auto;padding:6px 24px;font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chkline a{color:var(--navy-3);font-weight:600;text-decoration:none}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.ok{background:#4CC38A}.dot.bad{background:var(--dn)}
.main{max-width:1320px;margin:0 auto;padding:20px 24px 40px;display:flex;flex-direction:column;gap:18px}
.foot{text-align:center;color:var(--mut);font-size:12px;padding:0 16px 30px}
.mut{color:var(--mut)}
.note{background:#EAF2FB;border-left:4px solid var(--navy-4);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--ink)}
.note.err{background:#FDECEE;border-color:var(--dn)}
.sect h2{margin:6px 0 0;font-size:18px;color:var(--navy);display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-left:4px solid var(--gold);padding-left:10px}

/* ===== hero ===== */
.hero{background:linear-gradient(120deg,var(--navy-d),var(--navy) 60%,var(--navy-2));border-radius:20px;padding:24px 28px;color:#fff;display:grid;grid-template-columns:minmax(240px,1.1fr) minmax(300px,1.6fr) 150px;gap:24px;align-items:center;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(232,197,124,.18),transparent 70%)}
.hl1{font-size:13px;color:#BFD3E8}
.hv1{font-size:46px;font-weight:800;line-height:1.1;margin:4px 0 2px}
.hfull{font-size:12.5px;color:#9FB8D3}
.hdl{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.hs{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 22px}
.hs small{display:block;font-size:12px;color:#BFD3E8}
.hs b{font-size:22px;font-weight:700;display:block;color:#fff}
.hero .dl.up{background:rgba(76,195,138,.18);color:#8FE3B9}
.hero .dl.dn{background:rgba(247,185,199,.2);color:#FFC4CF}
.hero .dl.na{color:#9FB8D3;background:transparent;padding-left:0}
.hero .dl em{color:#BFD3E8}
.hr2{display:flex;justify-content:center;z-index:1}
.ring{width:140px;height:140px}
.rt1{font-size:24px;font-weight:800;fill:#F6E6BE}
.rt2{font-size:8.5px;fill:#BFD3E8}

/* ===== kpi ===== */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpis.k5{grid-template-columns:repeat(5,1fr)}
.kpis.kg{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.kpi{background:#fff;border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);border-top:3px solid var(--gold)}
.kpi.gk{border-top-width:4px}
.kl{font-size:12.5px;color:var(--mut)}
.kv{font-size:24px;font-weight:700;color:var(--navy);margin:2px 0}
.ks{font-size:12px;color:var(--mut);margin-top:2px}
.dl{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px}
.dl i{font-style:normal;font-size:9px}
.dl em{font-style:normal;font-weight:400;color:var(--mut)}
.dl.up{background:#E3F6EC;color:#14794F}
.dl.dn{background:#FCE6EA;color:#B8293F}
.dl.na{font-weight:400;color:var(--mut);padding-left:0;background:transparent}

/* ===== cards ===== */
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.g12{display:grid;grid-template-columns:minmax(300px,1fr) minmax(0,2.2fr);gap:18px;align-items:start}
.card{background:#fff;border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);min-width:0}
.card .ch{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.card h3{margin:0;font-size:14.5px;font-weight:700;color:var(--navy)}
.card h3 small{font-weight:400;font-size:12px;margin-left:4px}
.ap{font-size:11px;color:#8A9AB0;margin-bottom:10px}
.ap::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-right:6px}
.lnk{margin-top:10px;font-size:13px}
.lnk a{color:var(--navy-3);font-weight:600;text-decoration:none}
.empty{color:var(--mut);padding:24px;text-align:center;font-size:13px}
.btn-s{border:1px solid var(--line);background:#fff;border-radius:8px;font-size:12px;padding:5px 10px;cursor:pointer;color:var(--navy);font-weight:600}
.btn-s:hover{border-color:var(--gold);background:var(--gold-l)}
.sw{font-size:12.5px;color:var(--ink);display:inline-flex;align-items:center;gap:6px;cursor:pointer;margin-right:8px}
.tq{width:180px;margin-right:8px}

/* ===== charts ===== */
.tsw{width:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink);margin:0 0 6px 54px}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.lg i.ln{height:3px;width:16px;border-radius:2px}
.ts{display:block;max-width:100%}
.gl{stroke:#E8EEF5;stroke-width:1}
.ax{font-size:11px;fill:#7C8DA3}
.ts g[data-tip]:hover rect:first-child{fill:rgba(43,119,181,.07)}
.td{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.donut{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dsv{width:150px;height:150px;flex:0 0 150px}
.dsv circle{transition:opacity .15s}
.dsv circle:hover{opacity:.8}
.dt1{font-size:15px;font-weight:700;fill:#003056}
.dt2{font-size:8.5px;fill:#6B7C93}
.leg{list-style:none;margin:0;padding:0;flex:1;min-width:150px;display:flex;flex-direction:column;gap:5px}
.leg li{display:flex;align-items:center;gap:8px;font-size:12.5px}
.leg i{width:10px;height:10px;border-radius:3px;flex:0 0 10px}
.leg .lb{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbars{display:flex;flex-direction:column;gap:7px}
.hb{display:grid;grid-template-columns:minmax(80px,32%) 1fr auto auto;gap:10px;align-items:center;font-size:12.5px}
.hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.ht{height:12px;background:#EEF3F9;border-radius:6px;overflow:hidden}
.hf{height:100%;border-radius:6px}
.hv{font-weight:600;color:var(--navy);min-width:62px;text-align:right}
.hr{min-width:44px;text-align:right;font-size:12px}
.cr{color:var(--gold-dd);font-weight:700}
.upt{color:#14794F;font-weight:600}.dnt{color:#B8293F;font-weight:600}
#tip{position:fixed;display:none;z-index:99;background:var(--navy-d);color:#fff;font-size:12px;line-height:1.5;padding:8px 11px;border-radius:9px;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.28);max-width:300px;border:1px solid rgba(232,197,124,.45)}
#tip b{color:var(--gold-l)}

/* ===== tables ===== */
.twrap{overflow:auto;max-width:100%}
.tb{border-collapse:collapse;width:100%;font-size:12.5px}
.tb th{position:sticky;top:0;background:#F3F6FA;color:var(--navy);text-align:left;font-weight:700;padding:9px 10px;border-bottom:2px solid var(--gold);white-space:nowrap}
.tb th.r,.tb td.r{text-align:right}
.tb th.sr{cursor:pointer}
.tb th.sr:hover{background:#E9EFF7}
.tb th b{font-size:8px;margin-left:4px;color:var(--gold-d)}
.tb td{padding:8px 10px;border-bottom:1px solid #EDF1F6;vertical-align:middle}
.tb tbody tr:hover{background:#F8FAFD}
.tb tbody tr[data-r]{cursor:pointer}
.tb tr.sel{background:var(--gold-l)!important;box-shadow:inset 3px 0 0 var(--gold-d)}
.tb tr.pin td{background:#F3F6FA;font-style:italic}
.tb .dn{display:flex;flex-direction:column}
.tb .dn small{color:var(--mut);font-size:11px}
.tb td.mut{color:var(--mut)}
.cb{position:relative;min-width:84px;height:22px;display:flex;align-items:center;justify-content:flex-end}
.cb i{position:absolute;left:0;top:3px;bottom:3px;border-radius:4px;opacity:.55}
.cb span{position:relative;font-weight:600;padding:0 4px}
.chip{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;color:var(--navy-d);font-weight:600;white-space:nowrap}
.more{text-align:center;margin-top:10px}
.spw{width:90px;height:26px}
.spark{width:100%;height:100%;display:block}
.hwrap{overflow:auto}
.heat{border-collapse:separate;border-spacing:3px;font-size:12px;width:100%}
.heat th{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--navy);padding:4px 6px;text-align:center;font-size:11.5px}
.heat th.r{text-align:right}
.heat .rl{text-align:left;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:5px 8px;color:var(--ink);font-weight:500}
.heat td.num{text-align:center;padding:7px 6px;border-radius:6px;color:var(--navy-d)}
.heat td.r{text-align:right;background:transparent!important;font-weight:700;white-space:nowrap}

/* ===== modal / boot ===== */
.modal{position:fixed;inset:0;background:rgba(0,32,61,.5);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
.mbox{background:#fff;border-radius:16px;padding:18px 20px;max-width:760px;width:100%;max-height:80vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.4);border-top:4px solid var(--gold)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--navy);font-size:15px}
.boot{max-width:460px;margin:12vh auto;text-align:center;padding:24px}
.boot img{height:42px;filter:none;background:var(--navy);padding:10px 16px;border-radius:12px}
.boot h2{color:var(--navy)}

/* ===== responsive ===== */
@media(max-width:1100px){.hero{grid-template-columns:1fr 1fr}.hr2{display:none}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis.k5{grid-template-columns:repeat(3,1fr)}.g12{grid-template-columns:1fr}}
@media(max-width:720px){.top{position:static}.top-in{padding:10px 14px 6px}.bt{display:none}.meta{width:100%;justify-content:space-between}.main{padding:14px 12px 30px}.fbar-in,.chkline-in{padding-left:12px;padding-right:12px}.hero{grid-template-columns:1fr;padding:18px}.hv1{font-size:36px}.kpis,.kpis.k5{grid-template-columns:repeat(2,1fr)}.g2,.g3{grid-template-columns:1fr}.hb{grid-template-columns:90px 1fr auto}.hb .hr{display:none}.legend{margin-left:0}}

</style>
</head>

function dailyVals(res, key) { return rangeDates().map(function (d) { return res[key][DIDX[d]] || 0; }); }
function ma(vals, k) { return vals.map(function (v, i) { var s = 0, c = 0; for (var j = Math.max(0, i - k + 1); j <= i; j++) { s += vals[j]; c++; } return s / c; }); }
function rate(x, v) { return (v + x) ? x / (v + x) : 0; }
function chip(txt, i) { return '<span class="chip" style="background:' + col(i) + '">' + esc(txt) + '</span>'; }
var GRPS = [];
function grpIdx(g) { var i = GRPS.indexOf(g); if (i < 0) { GRPS.push(g); i = GRPS.length - 1; } return i; }

  if ((el = g('data-pre'))) { presetRange(el.getAttribute('data-pre')); redraw(); return; }
  if ((el = g('data-fo'))) { var id = el.getAttribute('data-fo'); OPEN = OPEN === id ? null : id; render(true); return; }
  if ((el = g('data-fa'))) { var d = FDEF.filter(function (x) { return x.id === el.getAttribute('data-fa'); })[0]; var q = (document.querySelector('[data-fq="' + d.id + '"]') || {}).value || ''; d.items().forEach(function (x) { if (!q || x.t.toLowerCase().indexOf(q.toLowerCase()) >= 0) F.sets[d.id].add(x.v); }); buildSel(); keepPop(d.id); return; }
  if ((el = g('data-fc'))) { var id2 = el.getAttribute('data-fc'); F.sets[id2].clear(); buildSel(); keepPop(id2); return; }
  if ((el = g('data-clearall'))) { Object.keys(F.sets).forEach(function (k) { F.sets[k].clear(); }); buildSel(); OPEN = null; redraw(); return; }
  if ((el = g('data-s'))) { var tb = t.closest('table'), tid = tb.getAttribute('data-id'), k = el.getAttribute('data-s'), st = UI.sort[tid]; if (st && st.k === k) st.d = -st.d; else UI.sort[tid] = { k: k, d: -1 }; render(true); return; }
  if ((el = g('data-more'))) { UI.more[el.getAttribute('data-more')] = +el.getAttribute('data-n'); render(true); return; }
  if ((el = g('data-csv'))) { exportCsv(el.getAttribute('data-csv'), el.getAttribute('data-name')); return; }
  if ((el = g('data-clear'))) { UI.selDeal = -1; redraw(); return; }
  if ((el = g('data-r'))) { var tb2 = el.closest('table'); if (tb2 && tb2.getAttribute('data-id') === 'dealTbl') { var r = +el.getAttribute('data-r'); UI.selDeal = (r >= 0 && UI.selDeal !== r) ? r : -1; redraw(); if (UI.selDeal >= 0) { var h = document.querySelector('.sect'); if (h) h.scrollIntoView({ behavior: 'smooth', block: 'start' }); } } return; }
  if (OPEN && !g('data-f')) { OPEN = null; render(true); }
});
function keepPop(id) { render(true); var l = document.querySelector('[data-fq="' + id + '"]'); if (l) l.focus(); redrawBody(); }
function redrawBody() { maskCache = {}; var y = window.scrollY, popOpen = OPEN; POST = []; CID = 0; var body; try { body = VIEWS[UI.tab](); } catch (e) { body = '<div class="note err">' + esc(e.message) + '</div>'; } $('main').innerHTML = body; POST.forEach(function (f) { f(); }); window.scrollTo(0, y); }
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.id === 'grpSmall') { UI.groupSmall = t.checked; redraw(); return; }
  if (t.id === 'dFrom' || t.id === 'dTo') { var f = isoYmd($('dFrom').value), to = isoYmd($('dTo').value); if (f && to) { if (f > to) { var x = f; f = to; to = x; } F.from = Math.max(DATES[0], f); F.to = Math.min(ASOF, to); redraw(); } return; }
  var fv = t.getAttribute && t.getAttribute('data-fv');
  if (fv) { var v = fval(fv, t.getAttribute('data-v')); if (t.checked) F.sets[fv].add(v); else F.sets[fv].delete(v); buildSel(); redrawBody(); var fp = document.querySelector('[data-f="' + fv + '"] .fv'); var sl = $('clrSlot'); if (sl) sl.innerHTML = Object.keys(F.sets).some(function (k) { return F.sets[k].size; }) ? CLRBTN : ''; if (fp) { var n = F.sets[fv].size; fp.textContent = n === 0 ? 'Tất cả' : (n + ' mục'); fp.parentNode.parentNode.classList.toggle('act', n > 0); } }
});
document.addEventListener('input', function (e) {
  var t = e.target, q = t.getAttribute && t.getAttribute('data-fq');
  if (q) { var d = FDEF.filter(function (x) { return x.id === q; })[0]; $('pl_' + q).innerHTML = popList(d, t.value); return; }
  if (t.id === 'storeQ') { UI.q.store = t.value; var pos = t.selectionStart; redrawBody(); var n = $('storeQ'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { if (SHOWCHK) { SHOWCHK = false; render(true); } else if (OPEN) { OPEN = null; render(true); } } });
var rsT = null;
window.addEventListener('resize', function () { clearTimeout(rsT); rsT = setTimeout(function () { POST.forEach(function (f) { f(); }); }, 120); });

/* ---- boot ---- */
function boot(data, sample) {
  IS_SAMPLE = !!sample; init(data); DIDX = {}; DATES.forEach(function (d, i) { DIDX[d] = i; });
  presetRange('mtd'); render(false);
}
function fail(msg) { $('app').innerHTML = '<div class="boot"><img src="' + LOGO + '" alt="PNJ"><h2>Chưa tải được dữ liệu</h2><p>' + esc(msg) + '</p><p class="mut">Kiểm tra file <b>data.json</b> đã được tải lên cùng thư mục với trang này chưa.</p></div>'; }
(function () {
  $('app').innerHTML = '<div class="boot"><img src="' + LOGO + '" alt="PNJ"><p class="mut">Đang tải dữ liệu...</p></div>';
  var url = 'data.json?v=' + Date.now();
  var tryEmbedded = function (err) { if (SAMPLE) boot(SAMPLE, true); else fail(err); };
  if (location.protocol === 'file:' && SAMPLE) { boot(SAMPLE, true); return; }
  fetch(url, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }).then(function (d) { boot(d, false); }).catch(function (e) { tryEmbedded(String(e.message || e)); });
})();
